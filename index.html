<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GitHub HTML Opener</title>
  <style>
    body {
      max-width: 760px;
      margin: 3rem auto;
      padding: 0 1rem;
      font: 16px/1.5 system-ui, sans-serif;
    }
    input, button {
      box-sizing: border-box;
      font: inherit;
      padding: .7rem;
    }
    input { width: 100%; margin: .5rem 0; }
    button { cursor: pointer; }
    #status { min-height: 1.5em; }
  </style>
</head>
<body>
  <h1>GitHub HTML Opener</h1>
  <p>Enter a GitHub file URL. The file will be fetched from GitHub’s raw-content host and opened in a new tab.</p>

  <form id="open-form">
    <label for="github-url">GitHub file URL</label>
    <input
      id="github-url"
      type="url"
      required
      placeholder="https://github.com/CoolDude2349/Offline-HTML-Games-Pack/files/offline/1.8_WASM.html"
    >
    <button type="submit">Open HTML</button>
  </form>

  <p id="status" role="status" aria-live="polite"></p>

  <script>
    const form = document.getElementById("open-form");
    const input = document.getElementById("github-url");
    const status = document.getElementById("status");

    function rawFileUrl(value) {
      const url = new URL(value);

      if (url.protocol !== "https:" || url.username || url.password) {
        throw new Error("Enter an HTTPS GitHub file URL.");
      }

      if (url.hostname === "raw.githubusercontent.com") {
        return url.href;
      }

      if (url.hostname !== "github.com") {
        throw new Error("The URL must be from github.com or raw.githubusercontent.com.");
      }

      const parts = url.pathname.split("/").filter(Boolean);
      if (parts.length < 5) {
        throw new Error("Use a GitHub file URL containing /blob/ or /files/.");
      }

      const [owner, repo, marker, ...rest] = parts;
      if (marker !== "blob" && marker !== "files") {
        throw new Error("The GitHub URL must contain /blob/ or /files/.");
      }

      // For /blob/{branch}/{path} and /files/{branch}/{path},
      // the first segment after the marker is treated as the branch.
      const branch = url.searchParams.get("ref") || rest.shift();
      if (!branch || rest.length === 0) {
        throw new Error("The URL must include a branch and file path.");
      }

      const safeSegment = segment => encodeURIComponent(decodeURIComponent(segment));
      const path = rest.map(safeSegment).join("/");
      return `https://raw.githubusercontent.com/${safeSegment(owner)}/${safeSegment(repo)}/${safeSegment(branch)}/${path}`;
    }

    form.addEventListener("submit", async event => {
      event.preventDefault();
      status.textContent = "";

      let tab;
      try {
        // Open synchronously from the click so the browser is less likely to block the tab.
        tab = window.open("about:blank", "_blank");
        if (!tab) throw new Error("The new tab was blocked. Allow pop-ups and try again.");

        // The fetched page runs in a sandboxed iframe, not in this page's origin.
        tab.opener = null;
        tab.document.title = "Loading GitHub HTML…";
        tab.document.body.textContent = "Fetching HTML…";

        const response = await fetch(rawFileUrl(input.value));
        if (!response.ok) {
          throw new Error(`GitHub returned HTTP ${response.status}.`);
        }

        const html = await response.text();
        const frame = tab.document.createElement("iframe");
        frame.title = "Fetched GitHub HTML";
        frame.setAttribute("sandbox", "allow-scripts");
        frame.referrerPolicy = "no-referrer";
        Object.assign(frame.style, {
          position: "fixed",
          inset: "0",
          width: "100%",
          height: "100%",
          border: "0"
        });

        tab.document.body.replaceChildren(frame);
        frame.srcdoc = html;
        tab.document.title = "GitHub HTML";
        status.textContent = "HTML opened in a new tab.";
      } catch (error) {
        if (tab && !tab.closed) {
          tab.document.body.textContent = error.message;
        }
        status.textContent = error.message;
      }
    });
  </script>
</body>
</html>
